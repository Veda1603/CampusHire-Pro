$kind: http-request
name: Add document
method: POST
url: "{{base_url}}/api/documents"
order: 3200
headers:
  Content-Type: application/json
  Authorization: Bearer {{auth_token}}
body:
  type: json
  content: |-
    {
      "studentId": 4,
      "documentType": "TRANSCRIPT",
      "documentUrl": "https://example.com/transcript.pdf"
    }
