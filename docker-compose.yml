version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # Relational Database: PostgreSQL
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: campushire-postgres
    restart: always
    environment:
      POSTGRES_USER: campushire_user
      POSTGRES_PASSWORD: 123456789
      POSTGRES_DB: campushire_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - campushire-network

  # ---------------------------------------------------------------------------
  # Document Database: MongoDB
  # ---------------------------------------------------------------------------
  mongodb:
    image: mongo:7.0
    container_name: campushire-mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin_password
      MONGO_INITDB_DATABASE: campushire_ai
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./infrastructure/mongo/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - campushire-network

  # ---------------------------------------------------------------------------
  # Cache & Session Store: Redis
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: campushire-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - campushire-network

  # ---------------------------------------------------------------------------
  # Event Streaming Platform: Apache Kafka & Zookeeper
  # ---------------------------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: campushire-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - campushire-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: campushire-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - campushire-network

volumes:
  postgres_data:
  mongo_data:
  redis_data:

networks:
  campushire-network:
    driver: bridge